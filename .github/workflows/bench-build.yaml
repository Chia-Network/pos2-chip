name: Benchmark build

# Compile `chia-pos2` Criterion benchmarks only (`--no-run`). Does not execute them.
on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-benches:
    name: Compile benches (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Rust Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

          key: bench-cargo-v3-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.github/actions/setup-rust/action.yml') }}
          restore-keys: bench-cargo-v3-${{ matrix.os }}-${{ runner.arch }}-

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Build benchmark targets (no run)
        run: cargo bench -p chia-pos2 --no-run
