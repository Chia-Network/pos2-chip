name: Rust

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-15-intel
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - windows-2022
          - windows-2025
    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Rust Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

          key: test-cargo-v3-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.github/actions/setup-rust/action.yml') }}
          restore-keys: test-cargo-v3-${{ matrix.os }}-${{ runner.arch }}-
  
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: fmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Test (release)
        run: cargo test --all --release --all-features -- --include-ignored

      - name: Test (debug)
        run: cargo test --all --all-features


  fuzz_tests:
    name: Fuzz (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: chia-pos2
        toolchain:
          - nightly-2026-08-01
        max_total_time:
          - 40
    env:
      CARGO_PROFILE_RELEASE_LTO: false
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

          key: fuzz-cargo-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.github/actions/setup-rust/action.yml') }}
          restore-keys: fuzz-cargo-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-0.13.2-v2

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo +"${{ matrix.toolchain }}" install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz
        env: ${{ matrix.package.env || fromJSON('{}') }}
        run: |
          cd crates/"${{ matrix.package.name }}"
          cargo fuzz list | xargs -I "%" sh -c "cargo +'${{ matrix.toolchain }}' fuzz run % -- -max_total_time=${{ matrix.max_total_time}} || exit 255"

  build-crate:
    name: Build Crate
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Cache Rust Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

          key: build-crate-cargo-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '.github/actions/setup-rust/action.yml') }}
          restore-keys: build-crate-cargo-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache cargo-workspaces
        id: cache-cargo-workspaces
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ws
          key: cargo-workspaces-${{ runner.os }}-${{ runner.arch }}-0.4.2-v2

      - name: Install cargo-workspaces
        if: steps.cache-cargo-workspaces.outputs.cache-hit != 'true'
        run: cargo install cargo-workspaces --version 0.4.2 --locked

      - name: Publish (dry run)
        run: cargo ws publish --publish-as-is --dry-run

      - name: Upload crate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crate
          path: ./target/package/*-*.crate

      - uses: rust-lang/crates-io-auth-action@v1
        if: startsWith(github.event.ref, 'refs/tags')
        id: auth

      - name: Publish (crates.io)
        if: startsWith(github.event.ref, 'refs/tags')
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo ws publish --publish-as-is
