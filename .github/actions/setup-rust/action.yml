name: Setup Rust

inputs:
  toolchain:
    required: false
    default: 1.92.0

  components:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
