name: Setup Rust

inputs:
  toolchain:
    required: false
    default: 1.92.0

  components:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
