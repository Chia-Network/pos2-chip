buildType:
  default: debug
  choices:
    debug:
      short: Debug
      buildType: Debug
    release:
      short: Release
      buildType: Release

libpos:
  default: off
  choices:
    off:
      short: libPOS Disabled
      long:  Disable libPOS target
      settings:
        CP_ENABLE_LIBPOS2: OFF
    on:
      short: libPOS Enabled
      long:  Enable libPOS target
      settings:
        CP_ENABLE_LIBPOS2: ON

tests:
  default: off
  choices:
    off:
      short: Tests Disabled
      long: Disable Tests
      settings:
        CP_BUILD_TESTS: OFF
    on:
      short: Tests Enabled
      long: Enable Tests
      settings:
        CP_BUILD_TESTS: ON
